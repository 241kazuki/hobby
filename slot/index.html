<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>シンプルスロット</title>

  <style>
    body {
      text-align: center;
      font-family: sans-serif;
      background-color: #f5f5f5;
      margin-top: 100px;
    }

    h1 {
      font-size: 40px;
    }

    #slot {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 40px;
    }

    .reel {
      width: 120px;
      height: 120px;

      background-color: white;
      border: 4px solid black;
      border-radius: 10px;

      display: flex;
      justify-content: center;
      align-items: center;

      font-size: 70px;
    }

    button {
      font-size: 24px;
      padding: 15px 40px;
      cursor: pointer;
    }

    #message {
      font-size: 30px;
      margin-top: 30px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>スロット</h1>

  <div id="slot">
    <div class="reel" id="reel1">🍒</div>
    <div class="reel" id="reel2">🔔</div>
    <div class="reel" id="reel3">7️⃣</div>
  </div>

  <button onclick="spin()">START</button>

  <div id="message"></div>

  <script>
    // スロットで使用する絵柄
    const symbols = ["🍒", "🔔", "7️⃣", "🍋", "⭐"];

    function spin() {

      // 0～4のランダムな数字を作る
      const random1 = Math.floor(Math.random() * symbols.length);
      const random2 = Math.floor(Math.random() * symbols.length);
      const random3 = Math.floor(Math.random() * symbols.length);

      // ランダムに絵柄を選択
      const result1 = symbols[random1];
      const result2 = symbols[random2];
      const result3 = symbols[random3];

      // 画面に表示
      document.getElementById("reel1").textContent = result1;
      document.getElementById("reel2").textContent = result2;
      document.getElementById("reel3").textContent = result3;

      // 当たり判定
      if (
        result1 === result2 &&
        result2 === result3
      ) {
        document.getElementById("message").textContent =
          "🎉 大当たり！ 🎉";
      } else {
        document.getElementById("message").textContent =
          "はずれ";
      }
    }
  </script>

</body>
</html>
